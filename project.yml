name: VietTelex
options:
  bundleIdPrefix: com.viettelex
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  TelexCore:
    path: TelexCore

schemes:
  VietTelex:
    build:
      targets:
        VietTelex: all
    test:
      targets:
        - VietTelexTests

targets:
  VietTelexTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    dependencies:
      - target: VietTelex
    settings:
      base:
        # Hosted tests: @testable import VietTelex needs the app module loaded.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/VietTelex.app/Contents/MacOS/VietTelex
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"

  VietTelex:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      # App icon: AppIcon.icns assembled from the palette-quantized PNG slices in
      # Assets.xcassets by Scripts/make_appicon.py (PNG chunks, NOT iconutil, NOT
      # actool). actool re-encoded the 8-bit palette PNGs to 32-bit and emitted a
      # second AppIcon.icns next to Assets.car: 360 KB car + 36 KB icns → 246 KB,
      # pixel-identical slices (measured 25/09/2026).
      - path: App/Resources/AppIcon.icns
        buildPhase: resources
      - path: App/Resources/MenuIcon.pdf
        buildPhase: resources
      # Bộ icon user chọn được (tab Thử nghiệm): MenuIcon.pdf là file ACTIVE mà
      # Info.plist trỏ tới; 1 = bản gốc Vᴛ (để quay lại), 2 = sao 5 cánh.
      # MenuIconSwitcher ghi đè file active theo lựa chọn — xem file đó cho rủi ro
      # seal đã chấp nhận (maintainer 17/08/2026).
      - path: App/Resources/MenuIcon1.pdf
        buildPhase: resources
      - path: App/Resources/MenuIcon2.pdf
        buildPhase: resources
      - path: App/Resources/MenuIcon3.pdf
        buildPhase: resources
      - path: App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Built-in per-app typing rules — repo-root data file (see its header);
      # bundled so AppState loads defaults from data, attached to releases.
      - path: typing-modes.yml
        buildPhase: resources
      - path: App/Resources/en.lproj/InfoPlist.strings
        buildPhase: resources
      - path: App/Resources/en.lproj/Localizable.strings
        buildPhase: resources
      - path: App/Resources/vi.lproj/InfoPlist.strings
        buildPhase: resources
      - path: App/Resources/vi.lproj/Localizable.strings
        buildPhase: resources
    dependencies:
      - package: TelexCore
        product: TelexCore
      - sdk: InputMethodKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viettelex.inputmethod.telex
        PRODUCT_NAME: VietTelex
        PRODUCT_MODULE_NAME: VietTelex
        INFOPLIST_FILE: App/Resources/Info.plist
        # .strings ship as UTF-8, not Xcode's default UTF-16 (Vietnamese text is
        # mostly 1-byte ASCII + 2-byte UTF-8: 52 KB → ~29 KB for vi, measured 25/09).
        STRINGS_FILE_OUTPUT_ENCODING: UTF-8
        # xcodebuild ad-hoc signs; Scripts/notarize-install.sh re-signs with
        # Developer ID + hardened runtime, then notarizes + staples. macOS 26
        # requires input methods to be NOTARIZED to register — verified with a
        # notarized third-party input method as control (registered) vs our
        # unnotarized builds (never
        # did). Uses VietTelex.entitlements (sandbox off, NO get-task-allow —
        # get-task-allow is rejected by notarization).
        CODE_SIGN_ENTITLEMENTS: App/Resources/VietTelex.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: "YES"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # App uses Swift 5 language mode (AppKit/IMK main-thread singletons).
        # TelexCore remains Swift 6 strict-concurrency clean.
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: "YES"
      configs:
        Debug:
          # Never let an Xcode-run IMK server register as the installed release.
          # Reusing the shipping TIS/connection identity lets both processes compete
          # for one input source and makes Accessibility status appear to disagree.
          PRODUCT_BUNDLE_IDENTIFIER: com.viettelex.inputmethod.telex.debug
          INFOPLIST_FILE: App/Resources/Debug-Info.plist
          # InfoPlist.strings localizes the shipping app name. Exclude that table only
          # in Debug so the Debug plist's distinct accessibility label takes effect.
          EXCLUDED_SOURCE_FILE_NAMES: InfoPlist.strings
        Release:
          # Size diet (Release ONLY — Debug keeps symbols so VietTelexTests'
          # BUNDLE_LOADER/@testable linking still works). Measured before: each
          # arch slice was ~950KB of which only ~380KB was __TEXT — the rest
          # mostly a 3.4k-entry symbol table nothing consumes (crash reports
          # symbolicate via the dSYM). ObjC runtime metadata (NSClassFromString
          # for InputMethodServerControllerClass) lives in __DATA and is NOT
          # affected by strip.
          DEPLOYMENT_POSTPROCESSING: "YES"
          STRIP_INSTALLED_PRODUCT: "YES"
          STRIP_STYLE: "all"
          # App-side code is I/O-bound (XPC/event round trips), so trade a few
          # percent of straight-line speed for size. TelexCore (the µs hot path)
          # builds as a package with its own -O and is untouched.
          SWIFT_OPTIMIZATION_LEVEL: "-Osize"
          LLVM_LTO: "YES_THIN"
