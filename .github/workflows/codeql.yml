name: CodeQL (Linux)

# Static analysis of the Linux IME: the C++ frontends + shared logic (linux/common, linux/fcitx5,
# linux/ibus) and the Python settings app (linux/settings). No build: `build-mode: none` reads
# the sources directly, so neither the Swift engine (libtelexcore) nor the Fcitx5 / IBus dev
# headers are needed on the runner. Read-only except for uploading the results to code scanning.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ["linux/**", ".github/workflows/codeql.yml"]
  pull_request:
    branches: [main]
    paths: ["linux/**", ".github/workflows/codeql.yml"]
  schedule:
    - cron: "17 3 * * 1"  # weekly: new queries catch old code
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write  # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, python]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
          config: |
            paths:
              - linux/common
              - linux/fcitx5
              - linux/ibus
              - linux/settings
            paths-ignore:
              - linux/dist
              - linux/packaging/out
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
