name: VietTelex-iOS
options:
  bundleIdPrefix: com.viettelex
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  # Engine dùng chung với repo open-source VietTelex (đặt CẠNH repo này):
  #   ~/ClaudeCode/VietTelex/TelexCore (../TelexCore)  ← sửa engine là cả macOS lẫn iOS thấy
  TelexCore:
    path: ../TelexCore
settings:
  base:
    DEVELOPMENT_TEAM: 84T567KMYD
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.2.5"
    CURRENT_PROJECT_VERSION: "15"
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      LLVM_LTO: YES_THIN
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
targets:
  VietTelexApp:
    type: application
    platform: iOS
    sources:
      - App
      # Token theme + pipeline ảnh nền dùng chung với extension.
      - Keyboard/KeyboardTheme.swift
      - Keyboard/Wallpaper.swift
      - Keyboard/Shortcuts.swift
      - Shared
      # Từ điển cá nhân: app đọc/sửa userlm.plist bằng chính model của bàn phím.
      - Keyboard/UserLangModel.swift
      # Luyện vuốt (App/Practice): CÙNG decoder + hình học phím với bàn phím.
      - Keyboard/SwipeDecoder.swift
      - Keyboard/SwipeLexicon.swift
      - Keyboard/SwipeEnglish.swift
      - Keyboard/VNLexicon2.swift
      - Keyboard/VNSuggest.swift
      - Keyboard/SyllableLM.swift
      - Keyboard/KeyGeometry.swift
      - Keyboard/TouchGeometry.swift
      - path: Keyboard/Resources/vnlexicon.bin
        buildPhase: resources
      - path: Keyboard/Resources/enlexicon.bin
        buildPhase: resources
      - path: ios-mau-cau.yml
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viettelex.ios
        # App.entitlements gồm App Group + iCloud Key-Value Store (đồng bộ cài đặt/gõ
        # tắt/mẫu câu, App/Backup/ICloudSync.swift). Chủ repo cần bật capability
        # "iCloud → Key-value storage" cho App ID com.viettelex.ios trên developer
        # portal (không cần tạo iCloud container) trước khi ký bản thiết bị/App Store.
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: VietTelex
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPad multitasking bắt buộc đủ 4 hướng (App Store từ chối upload 90474, 25/09/2026).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: App/Info.plist
      properties:
        # Chỉ HTTPS chuẩn → miễn khai báo xuất khẩu mã hoá (khỏi hỏi mỗi lần upload).
        ITSAppUsesNonExemptEncryption: false
        # bubble ⚙️ trên keyboard mở app: viettelex://maucau
        CFBundleURLTypes:
          - CFBundleURLName: com.viettelex.ios
            CFBundleURLSchemes: [viettelex]
    dependencies:
      - target: VietTelexKeyboard
        embed: true
      # SwipeEnglish (Luyện vuốt) dùng bảng từ tiếng Anh của engine.
      - package: TelexCore
  VietTelexKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
      - path: ios-mau-cau.yml
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viettelex.ios.keyboard
        CODE_SIGN_ENTITLEMENTS: Keyboard/Keyboard.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Keyboard/ObjC/VietTelexKeyboard-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Tiếng Việt (VietTelex)"
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: "Tiếng Việt (VietTelex)"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: vi
            # true để iOS hiện công tắc "Cho phép Toàn quyền" — cần cho Rung
            # phím + Mẫu câu động https:// (quyết định user 2026-07-24). App
            # vẫn không thu thập gì; hai tính năng trên là lý do duy nhất.
            RequestsOpenAccess: true
    dependencies:
      - package: TelexCore
  VietTelexKeyboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KeyboardTests
      - Keyboard/EngineBridge.swift
      - Keyboard/FieldPolicy.swift
      - Keyboard/CompositionSync.swift
      - Keyboard/PlanePolicy.swift
      - Keyboard/KeyLayout.swift
      - Keyboard/KeyboardView.swift
      - Keyboard/KeySound.swift
      - App/KeySoundImport.swift
      - Keyboard/OneHand.swift
      - Keyboard/EmojiPlane.swift
      - Keyboard/EmojiData.swift
      - Keyboard/EmojiSearch.swift
      - Keyboard/EmojiSearchBar.swift
      - Keyboard/AppearancePolicy.swift
      - Keyboard/KeyboardTheme.swift
      - Keyboard/Wallpaper.swift
      - Keyboard/KeyCommitQueue.swift
      - Keyboard/AdjacentKeyFixer.swift
      - Keyboard/AutoCorrect.swift
      - Keyboard/TouchGeometry.swift
      - Keyboard/KeyGeometry.swift
      - Keyboard/TouchLog.swift
      - Keyboard/SuggestionSupport.swift
      - Keyboard/SuggestionSlots.swift
      - Keyboard/NumberChips.swift
      - Keyboard/MathResults.swift
      - Keyboard/VNSuggest.swift
      - Keyboard/VNLexicon2.swift
      - Keyboard/EmojiSuggest.swift
      - Keyboard/WordDelete.swift
      - Keyboard/UserLangModel.swift
      - Keyboard/SeedData.swift
      - Keyboard/DisplayCase.swift
      - Keyboard/SensitiveWords.swift
      - Keyboard/Trackpad.swift
      - Keyboard/SwipeDecoder.swift
      - Keyboard/SwipeLexicon.swift
      - Keyboard/SwipeGesture.swift
      - Keyboard/SwipeTyping.swift
      - Keyboard/SpaceFlick.swift
      - Keyboard/KeyAlternates.swift
      - Keyboard/DomainPopup.swift
      - Keyboard/KeyVariants.swift
      - Keyboard/SwipeRevise.swift
      - App/Practice/SwipePractice.swift
      - App/Backup/BackupFormat.swift
      - App/TemplateEdit.swift
      - App/Backup/SyncMerge.swift
      - App/Backup/SyncCore.swift
      - App/Backup/BackupStore.swift
      - Keyboard/SwipeEnglish.swift
      - Keyboard/AddTones.swift
      - Keyboard/SyllableLM.swift
      - Keyboard/FutoSwipeModel.swift
      - Keyboard/FutoSwipe.swift
      - Keyboard/TouchTarget.swift
      - Keyboard/Shortcuts.swift
      - Keyboard/TextTools.swift
      - Keyboard/TextToolRunner.swift
      # bảng gõ tắt mẫu ở gốc repo — test khứ hồi parse/export cùng định dạng macOS
      - path: ../sample-shortcuts.yml
      # VietTelex Plus: gate dùng chung + logic mua (không StoreKit) + cấu hình StoreKit test.
      - Shared
      - App/Plus/PlusStoreModel.swift
      - path: StoreKit/VietTelex.storekit
        buildPhase: resources
      - Keyboard/ClipDetect.swift
      - Keyboard/ClipboardHistory.swift
      - Keyboard/ClipboardFeature.swift
      - Keyboard/PasteOfferOnce.swift
      # Bench đường nóng qua controller thật (KeyboardBenchTests, bộ chậm).
      - Keyboard/KeyboardViewController.swift
      - Keyboard/ObjC/VTCatch.m
      - Keyboard/ClipboardPanel.swift
      - path: Keyboard/Resources/vnlexicon.bin
        buildPhase: resources
      - path: Keyboard/Resources/emoji.bin
        buildPhase: resources
      - path: Keyboard/Resources/enlexicon.bin
        buildPhase: resources
      - path: Keyboard/Resources/vnlm.bin
        buildPhase: resources
      - path: Keyboard/Resources/futoswipe.bin
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Keyboard/ObjC/VietTelexKeyboard-Bridging-Header.h
    dependencies:
      - package: TelexCore

schemes:
  # App + file cấu hình StoreKit cục bộ (mua thử trên simulator, không cần App
  # Store Connect). Release/archive không dùng file này.
  VietTelexApp:
    build:
      targets:
        VietTelexApp: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/VietTelex.storekit
    archive:
      config: Release
  # Test scheme khai báo ở đây (trước đây là file xcscheme ngoài git, bị xcodegen
  # xoá mỗi lần generate). Chạy: xcodebuild -scheme VietTelexKeyboardTests test
  VietTelexKeyboardTests:
    build:
      targets:
        VietTelexKeyboardTests: [test]
    test:
      targets:
        - VietTelexKeyboardTests
  # Bộ test CHẬM (KeyboardTests/SlowTests.swift): heldout, độ trễ, RAM, StoreKit session —
  # bộ mặc định bỏ qua (XCTSkip) vì làm runner bị kill khi máy tải cao.
  # Chạy: xcodebuild -scheme VietTelexKeyboardSlowTests -destination '…' test
  VietTelexKeyboardSlowTests:
    build:
      targets:
        VietTelexKeyboardTests: [test]
    test:
      environmentVariables:
        VT_SLOW_TESTS: "1"
      targets:
        - name: VietTelexKeyboardTests
          selectedTests:
            - SwipeEnglishTests/testMeasureEnglishAndVietnamese
            - SwipeEnglishTests/testBenchmarkWithEnglish
            - SyllableLMTests/testHeldoutAccuracy
            - SyllableLMTests/testHeldoutAccuracyWithEnglish
            - SyllableLMTests/testLookupLatency
            - SwipeReviseTests/testHeldoutRevisionGain
            - SuggestBigramTests/testHeldoutNewUser
            - SuggestBigramTests/testHeldoutLearningUserNotHurt
            - SuggestBigramTests/testLatencyAndDirtyMemory
            - SuggestTrigramTests/testHeldoutBeforeAfter
            - SuggestTrigramTests/testLatency
            - SwipeDecoderTests/testBenchmark
            - TouchTargetTests/testLatency
            - KeyboardBenchTests/testHotPathBench
            - RamBreakdownTests/testComponentBreakdown
            - KeyboardThemeTests/testKeyboardDecodeMemoryFootprint
            - PlusStoreKitConfigTests/testStoreKitTestSessionLoadsProducts
