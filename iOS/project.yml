name: VietTelex-iOS
options:
  bundleIdPrefix: com.viettelex
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  # Engine dùng chung với repo open-source VietTelex (đặt CẠNH repo này):
  #   ~/ClaudeCode/VietTelex/TelexCore (../TelexCore)  ← sửa engine là cả macOS lẫn iOS thấy
  TelexCore:
    path: ../TelexCore
settings:
  base:
    DEVELOPMENT_TEAM: 84T567KMYD
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.1.2"
    CURRENT_PROJECT_VERSION: "5"
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      LLVM_LTO: YES_THIN
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
targets:
  VietTelexApp:
    type: application
    platform: iOS
    sources:
      - App
      - path: ios-mau-cau.yml
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viettelex.ios
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: VietTelex
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPad multitasking bắt buộc đủ 4 hướng (App Store từ chối upload 90474, 25/09/2026).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: App/Info.plist
      properties:
        # Chỉ HTTPS chuẩn → miễn khai báo xuất khẩu mã hoá (khỏi hỏi mỗi lần upload).
        ITSAppUsesNonExemptEncryption: false
        # bubble ⚙️ trên keyboard mở app: viettelex://maucau
        CFBundleURLTypes:
          - CFBundleURLName: com.viettelex.ios
            CFBundleURLSchemes: [viettelex]
    dependencies:
      - target: VietTelexKeyboard
        embed: true
  VietTelexKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - path: ios-mau-cau.yml
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viettelex.ios.keyboard
        CODE_SIGN_ENTITLEMENTS: Keyboard/Keyboard.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Tiếng Việt (VietTelex)"
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: "Tiếng Việt (VietTelex)"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: vi
            # true để iOS hiện công tắc "Cho phép Toàn quyền" — cần cho Rung
            # phím + Mẫu câu động https:// (quyết định user 2026-07-24). App
            # vẫn không thu thập gì; hai tính năng trên là lý do duy nhất.
            RequestsOpenAccess: true
    dependencies:
      - package: TelexCore
  VietTelexKeyboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KeyboardTests
      - Keyboard/EngineBridge.swift
      - Keyboard/FieldPolicy.swift
      - Keyboard/CompositionSync.swift
      - Keyboard/PlanePolicy.swift
      - Keyboard/KeyLayout.swift
      - Keyboard/KeyboardView.swift
      - Keyboard/EmojiPlane.swift
      - Keyboard/EmojiData.swift
      - Keyboard/AppearancePolicy.swift
      - Keyboard/KeyCommitQueue.swift
      - Keyboard/AdjacentKeyFixer.swift
      - Keyboard/TouchGeometry.swift
      - Keyboard/TouchLog.swift
      - Keyboard/SuggestionSupport.swift
      - Keyboard/VNSuggest.swift
      - Keyboard/VNLexicon2.swift
      - Keyboard/EmojiSuggest.swift
      - Keyboard/WordDelete.swift
      - Keyboard/UserLangModel.swift
      - Keyboard/SeedData.swift
      - Keyboard/DisplayCase.swift
      - Keyboard/SensitiveWords.swift
      - Keyboard/EmojiData.swift
      - path: Keyboard/Resources/vnlexicon.bin
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: TelexCore

schemes:
  # Test scheme khai báo ở đây (trước đây là file xcscheme ngoài git, bị xcodegen
  # xoá mỗi lần generate). Chạy: xcodebuild -scheme VietTelexKeyboardTests test
  VietTelexKeyboardTests:
    build:
      targets:
        VietTelexKeyboardTests: [test]
    test:
      targets:
        - VietTelexKeyboardTests
