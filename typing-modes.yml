md.obsidian: tap
com.figma.Desktop: tap
com.vng.zalo: tap
ru.keepcoder.Telegram: tap
# Messenger desktop (unofficial Electron wrapper) — field report 2026-08-11: marked
# text/underline (app fell through the safe-unknown-app default). Same Electron
# edge-of-word class as Slack/Discord/Lark above.
com.facebook.archon.developerID: tap
# Đã kiểm chứng gõ trực tiếp tốt
com.apple.Notes: inPlace
# iPhone Mirroring — CÙNG bundle id với Screen Sharing cũ (com.apple.ScreenContinuity)
# nên từng bị xếp nhầm vào nhóm remote-desktop passthrough; khác VNC/RDP/VM, nó bắc
# cầu Continuity tới ô nhập THẬT trên iPhone (không phải scancode thô cho guest OS) —
# maintainer field-test 07/08/2026: gõ trực tiếp mượt.
com.apple.ScreenContinuity: inPlace
# Batch 06/08/2026 — maintainer field-verified (learned in-place OK trên máy thật)
com.apple.TextEdit: inPlace
com.apple.Preview: inPlace
com.apple.Passwords: inPlace
com.apple.appkit.xpc.openAndSavePanelService: inPlace
# Popover đổi tên file trên thanh tiêu đề (Preview/TextEdit/Pages…) — cũng là
# remote view service của AppKit như save panel ở trên. Thiếu rule thì client id
# lạ này rơi vào safe-unknown → IMK tap-defer, trong khi tap lại quyết theo
# frontmost (Preview = inPlace) và pass → hai bên nhường nhau, phím ra thô
# (issue #55, 17/08/2026: "Haf tieen" nguyên xi trong ô rename của Preview).
com.apple.appkit.xpc.documentPopoverViewService: inPlace
com.apple.SafariPlatformSupport.Helper: inPlace
com.robinhood.release.Money: inPlace
com.relaykey.client: inPlace
com.westbridge.stremio5-mac: inPlace
com.apple.finder: inPlace
com.apple.ActivityMonitor: inPlace
com.apple.Spotlight: inPlace
# Overlay launcher (Alfred, Raycast, LaunchBar): cùng lớp Spotlight — ô tìm kiếm là
# NSTextField chuẩn, gõ trực tiếp sạch. Thiếu rule thì rơi vào "app lạ → kênh an
# toàn" = marked text, và user thấy "tự nhiên bị gạch chân khi mở Alfred" (issue
# #57, 22/08/2026: chỉ lộ khi app dưới overlay là in-place — trên terminal/browser
# thì routing theo frontmost đã đưa sang tap nên không ai để ý).
com.runningwithcrayons.Alfred: inPlace
com.raycast.macos: inPlace
at.obdev.LaunchBar: inPlace
com.microsoft.Word: inPlace
com.macromates.TextMate: inPlace
net.whatsapp.WhatsApp: inPlace
com.viettelex.inputmethod.telex: inPlace
com.microsoft.Powerpoint: inPlace
com.apple.iWork.Pages: inPlace
com.apple.iWork.Numbers: inPlace
com.apple.iWork.Keynote: inPlace
com.apple.dt.Xcode: inPlace
com.apple.MobileSMS: inPlace
# Spark Classic — composer là WebView, WebKit macOS 26 nuốt synthetic burst của
# tap (issue #47, cùng gốc #44); reporter field-verify in-place OK 13/08/2026.
com.readdle.smartemail-Mac: inPlace
# Outlook — compose là web editor trong WKWebView, cùng lớp #44/#47 (field
# report Facebook 14/08: từ có dấu "cũng/được/làm" không gõ được vì burst bị
# nuốt, từ không dấu vẫn ăn). Word/PowerPoint đã inPlace sẵn; Outlook bị thiếu.
com.microsoft.Outlook: inPlace
com.apple.mail: inPlace
# MarkEdit — editor là CodeMirror 6 trong WKWebView: xử lý Backspace bằng JS và
# áp edit vào document model BẤT ĐỒNG BỘ, nên loạt ⌫+retype của tap về sai thứ
# tự (tap phát đủ edit — đếm log không thiếu lần nào — mà màn hình vẫn rơi dấu,
# thừa ký tự, lệch ô). Cùng lớp WebView #44/#47, KHÁC lớp Electron biên-từ:
# MarkEdit honor replacementRange thật (probe regionMatch=yes, reprobe
# imkMatch2=yes, không gạch chân). Port từ fork xkhanhs/vtx (35b53f5,
# maintainer field-test 14/08/2026).
app.cyan.markedit: inPlace
