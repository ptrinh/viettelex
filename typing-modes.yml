# OK" (caret thật thà nhưng editor nuốt edit ở biên từ — lớp lỗi Discord).
com.larksuite.macos.lark: tap
com.electron.lark: tap
com.bytedance.macos.feishu: tap
com.tinyspeck.slackmacgap: tap
com.hnc.Discord: tap
