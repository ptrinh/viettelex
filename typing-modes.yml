# JetBrains/Android Studio: KHÔNG có rule built-in — để auto (probe → learn).
# 12 rule `selection` từng nằm ở đây nhưng là dead data cho tới 1.4.24; khi
# chúng "sống lại" (1.4.24) thì Shift+← overtype phá integrated TERMINAL bên
# trong IDE (field report 03/08/2026: WebStorm terminal "tự nhảy thêm chữ,
# dồn cục"). Selection chỉ đúng cho EDITOR, sai cho terminal cùng app — mode
# per-app không tách được 2 vùng này, nên selection chỉ nên là pin thủ công.
# Grid app: cell autocomplete đua backspace, Shift+← chọn ô kề
com.microsoft.Excel: emptyReset
